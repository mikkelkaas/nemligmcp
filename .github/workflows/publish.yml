name: Release

# Conventional-commits release. On every push to master, semantic-release reads
# the commits since the last release, decides the next version (fix: -> patch,
# feat: -> minor, BREAKING CHANGE -> major), updates the changelog + package.json,
# tags, creates a GitHub Release, and publishes to npm (with provenance).
# Commits without a release-worthy type are a no-op.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags/releases and commit the version + changelog back
      issues: write
      pull-requests: write
      id-token: write # OIDC: npm Trusted Publishing + provenance (no NPM_TOKEN needed)
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # semantic-release v25 requires Node >=22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Publishes via npm Trusted Publishing (OIDC) — semantic-release exchanges
      # the GitHub OIDC token for a short-lived npm token, so no NPM_TOKEN secret
      # is needed. Provenance is attached automatically.
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npx semantic-release


  # Separate job so a failed push can be re-run without re-running the release, and so
  # the third-party docker actions never run with the npm OIDC token.
  image:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Compute major version tag
        id: tag
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/mikkelkaas/nemligmcp:latest
            ghcr.io/mikkelkaas/nemligmcp:${{ needs.release.outputs.version }}
            ghcr.io/mikkelkaas/nemligmcp:${{ steps.tag.outputs.major }}
